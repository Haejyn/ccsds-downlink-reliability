name: reliability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (warnings as errors, .NET analyzers)
        run: dotnet build tests/SpaceLink.Tests -c Release
      - name: Test with coverage gate (line 90 / branch 85)
        run: >
          dotnet test tests/SpaceLink.Tests -c Release --no-build
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory build/test-results
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=../../build/coverage/
          /p:Threshold=90%2c85 /p:ThresholdType=line%2cbranch /p:ThresholdStat=total
      - name: Requirements traceability (spec ↔ Trait ↔ TRX)
        run: python tools/trace.py
      # 외부 구현 기준 벡터가 재현되는지 — libfec 를 고정 커밋으로 받아 gcc 로 빌드해 다시 만들고 저장소 파일과 대조한다.
      # 누가 벡터만 손으로 고치거나 생성기를 바꾸고 다시 굽지 않으면 여기서 실패한다. gcc 가 있는 ubuntu 에서만 돈다.
      - name: libfec golden vectors are reproducible
        if: runner.os == 'Linux'
        run: python tools/gen_golden_libfec.py --check
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.os }} · .NET 10"
            tail -2 docs/traceability.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: build

  benchmark:
    name: 할당 회귀 게이트 (BenchmarkDotNet)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 시간이 아니라 **프레임당 할당**으로 막는다. 공유 러너는 실행 시간이 크게 흔들려
      # 시간 기준은 거짓 실패를 만들지만, 할당량은 러너 성능과 무관하다.
      # 벤치마크마다 예산이 다르다(추출만 260 B · 채널 체인 1,340 B …) — 예산 표는 tools/check_allocation.py.
      # 필터를 열어 둔 것은 새 벤치마크가 조용히 게이트 밖으로 새지 못하게 하려는 것이다:
      # 예산 표에 없는 벤치마크가 나오면 스크립트가 실패한다.
      - name: Run benchmarks (short job)
        run: >
          dotnet run -c Release --project benchmarks/SpaceLink.Benchmarks --
          --filter '*' --job short --exporters json
          --artifacts build/benchmark
      - name: Check allocation per frame
        run: python tools/check_allocation.py build/benchmark
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: build/benchmark

  mutation:
    name: Stryker.NET mutation testing
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker
      - name: Run mutation tests (break below 80)
        working-directory: tests/SpaceLink.Tests
        run: dotnet stryker --project SpaceLink.csproj --break-at 80 --reporter html --reporter progress --output ../../build/stryker
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: build/stryker
