name: reliability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (warnings as errors, .NET analyzers)
        run: dotnet build tests/SpaceLink.Tests -c Release
      - name: Test with coverage gate (line 90 / branch 85)
        run: >
          dotnet test tests/SpaceLink.Tests -c Release --no-build
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory build/test-results
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=../../build/coverage/
          /p:Threshold=90%2c85 /p:ThresholdType=line%2cbranch /p:ThresholdStat=total
      - name: Requirements traceability (spec ↔ Trait ↔ TRX)
        run: python tools/trace.py
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.os }} · .NET 10"
            tail -2 docs/traceability.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: build

  benchmark:
    name: 할당 회귀 게이트 (BenchmarkDotNet)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 시간이 아니라 **프레임당 할당**으로 막는다. 공유 러너는 실행 시간이 크게 흔들려
      # 시간 기준은 거짓 실패를 만들지만, 할당량은 러너 성능과 무관하다.
      # 기준 260 B — 현재 244 B (개선 전 443 B, docs/test-report.md §8).
      - name: Run benchmark (short job)
        run: >
          dotnet run -c Release --project benchmarks/SpaceLink.Benchmarks --
          --filter '*Reassemble*' --job short --exporters json
          --artifacts build/benchmark
      - name: Check allocation per frame
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, sys
          FRAMES = 78001          # 패킷 60,000 개를 128 바이트 프레임으로 포장한 수
          LIMIT = 260             # 바이트/프레임
          # --exporters json 이 만드는 이름은 *-report-full-compressed.json 이다 (full 이 아니다).
          reports = glob.glob("build/benchmark/results/*-report-full-compressed.json")
          if not reports:
              sys.exit("벤치마크 결과를 찾지 못했다")
          worst = 0.0
          for path in reports:
              for case in json.load(open(path, encoding="utf-8"))["Benchmarks"]:
                  per_frame = case["Memory"]["BytesAllocatedPerOperation"] / FRAMES
                  print(f"{case['Method']}: {per_frame:.1f} B/프레임")
                  worst = max(worst, per_frame)
          print(f"최대 {worst:.1f} B/프레임 (기준 {LIMIT})")
          if worst > LIMIT:
              sys.exit(f"할당 회귀: {worst:.1f} B/프레임 > {LIMIT}")
          PY
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: build/benchmark

  mutation:
    name: Stryker.NET mutation testing
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker
      - name: Run mutation tests (break below 80)
        working-directory: tests/SpaceLink.Tests
        run: dotnet stryker --project SpaceLink.csproj --break-at 80 --reporter html --reporter progress --output ../../build/stryker
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: build/stryker
